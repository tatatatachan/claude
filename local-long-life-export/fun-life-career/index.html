<title>FUN LIFE & CAREER 図版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: one portrait figure. Muted "before" on cream, a mint wave, then the overlapping-circles "after" on mint-light, closed by a mint bar.
   Palette and type are taken from the Local Long Life flyer (single light look, like the flyer). */
:root {
  --mint: #55C5B0; --mint-d: #2f9d89; --mint-l: #DBF2E2;
  --cream: #FFFEF2; --ink: #323042; --ink-s: #6c6a7a;
  --orange: #F28A3C; --hl: #F6D36B;
  --old-fill: #ECEBF0; --old-line: #C3C2CC; --old-ic1: #9A99A8; --old-ic2: #C9C8D2;
  --font: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --en: "Barlow Condensed", "Zen Kaku Gothic New", sans-serif;
  color-scheme: light;
}
body { background: var(--cream); color: var(--ink); font-family: var(--font); }
.wrap { max-width: 640px; margin-inline: auto; padding-inline: 16px; padding-block: 20px 36px; }
figure { margin: 0; }
figure svg { display: block; width: 100%; height: auto; max-width: 100%; border-radius: 14px; box-shadow: 0 6px 24px rgba(50,48,66,.16); }
figcaption { margin-top: 10px; font-size: 12px; color: var(--ink-s); text-align: center; }
svg text { font-family: var(--font); fill: var(--ink); text-anchor: middle; word-break: keep-all; }
.en { font-family: var(--en); font-weight: 700; letter-spacing: .24em; }
.lbl { font-size: 20px; font-weight: 900; letter-spacing: .03em; }
.sub { font-size: 15px; font-weight: 700; letter-spacing: .03em; fill: var(--ink-s); }
.o1 { --ic1: var(--old-ic1); --ic2: var(--old-ic2); --sunc: var(--old-ic1); }
.n1 { --ic1: var(--mint-d); --ic2: rgba(47,157,137,.42); --sunc: var(--hl); }
.n2 { --ic1: var(--orange); --ic2: rgba(242,138,60,.42); }
.p1 { fill: var(--ic1); } .p2 { fill: var(--ic2); } .ps { fill: var(--sunc); }
.l1 { stroke: var(--ic1); fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
</style>

<main class="wrap">
  <figure>
    <svg viewBox="0 0 600 790" role="img" aria-label="従来は地方での暮らし(ゆとり)と本気のキャリア(成長・評価)の二者択一と考えられていた。この視点を転換し、地方で暮らす豊かさと成長企業で育むキャリアが重なる部分に、年をとるほど楽しくなる人生、FUN LIFE & CAREERがある。">
      <defs>
        <g id="rural">

          <rect class="p2" x="-38" y="2" width="32" height="30"/>
          <rect class="p1" x="-26" y="14" width="9" height="18"/>

          <circle class="ps" cx="-38" cy="-46" r="12"/>
        </g>
        <g id="career">

          <rect class="p2" x="-12" y="8" width="24" height="46"/>
          <rect class="p2" x="22" y="-16" width="24" height="70"/>
          <polyline class="l1" points="-50,-6 -16,-32 6,-20 46,-56"/>
          <polygon class="p1" points="56,-66 34,-60 50,-44"/>
        </g>
        <clipPath id="lens"><circle cx="375" cy="560" r="125"/></clipPath>
      </defs>
