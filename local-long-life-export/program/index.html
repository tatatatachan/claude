<style>
/* Layout: portrait timetable. Time column + mint rail on the left, content on the right, dotted rules between rows. Same palette and type as the Local Long Life flyer. */
:root {
  --mint: #55C5B0; --mint-d: #2f9d89; --mint-l: #DBF2E2;
  --cream: #FFFEF2; --ink: #323042; --ink-s: #6c6a7a;
  --orange: #F28A3C; --hl: #F6D36B;
  --old-fill: #ECEBF0; --old-line: #C3C2CC; --old-ic1: #9A99A8; --old-ic2: #C9C8D2;
  --font: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --en: "Barlow Condensed", "Zen Kaku Gothic New", sans-serif;
  color-scheme: light;
}
body { background: var(--cream); color: var(--ink); font-family: var(--font); }
.wrap { max-width: 1240px; margin-inline: auto; padding-inline: 16px; padding-block: 20px 36px; }
figure { margin: 0; }
figure svg { display: block; width: 100%; height: auto; max-width: 100%; border-radius: 14px; box-shadow: 0 6px 24px rgba(50,48,66,.16); }
figcaption { margin-top: 10px; font-size: 12px; color: var(--ink-s); text-align: center; }
svg text { font-family: var(--font); fill: var(--ink); text-anchor: middle; word-break: keep-all; }
.en { font-family: var(--en); font-weight: 700; letter-spacing: .24em; }
.lbl { font-size: 20px; font-weight: 900; letter-spacing: .03em; }
.sub { font-size: 15px; font-weight: 700; letter-spacing: .03em; fill: var(--ink-s); }
.o1 { --ic1: var(--old-ic1); --ic2: var(--old-ic2); --sunc: var(--old-ic1); }
.n1 { --ic1: var(--mint-d); --ic2: rgba(47,157,137,.42); --sunc: var(--hl); }
.n2 { --ic1: var(--orange); --ic2: rgba(242,138,60,.42); }
.p1 { fill: var(--ic1); } .p2 { fill: var(--ic2); } .ps { fill: var(--sunc); }
.l1 { stroke: var(--ic1); fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.tm,.tm2,.mn,.hd,.bl{text-anchor:start}.tm{font-family:var(--en);font-weight:700;font-size:28px;fill:var(--mint-d)}.tm2{font-family:var(--en);font-weight:600;font-size:18px;fill:var(--ink-s)}.mn{font-size:13px;font-weight:700;fill:var(--ink-s)}.hd{font-size:19px;font-weight:900}.bl{font-size:15px;font-weight:500;fill:var(--ink)}
</style>

<text class="hd" x="120" y="317">軽井沢のコテージに集合</text>
<text class="bl" x="120" y="346" style="fill:var(--mint-d);font-weight:900">●</text><text class="bl" x="136" y="346">オープニング</text>
<text class="bl" x="120" y="374" style="fill:var(--mint-d);font-weight:900">●</text><text class="bl" x="136" y="374">成長産業である、エフビー介護サービスの事業について</text>
<text class="bl" x="120" y="402" style="fill:var(--mint-d);font-weight:900">●</text><text class="bl" x="136" y="402">インターンシップのミッションと背景の共有</text>
<line x1="64" x2="568" y1="424" y2="424" stroke="var(--mint)" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/>
<text class="hd" x="120" y="463">ご利用者さん目線を体験してみよう</text>
<text class="bl" x="120" y="492" style="fill:var(--mint-d);font-weight:900">●</text><text class="bl" x="136" y="492">軽井沢のコテージを、ご利用者さんの家に見立て、</text>
<text class="bl" x="136" y="514">提供者視点に立ってみましょう。</text>
<text class="bl" x="120" y="542" style="fill:var(--mint-d);font-weight:900">●</text><text class="bl" x="136" y="542">車椅子、歩行器など、実際の福祉用具をご利用者目線で体験</text>
<text class="bl" x="136" y="564">（お昼ごはんなども車椅子で食べるなどを実践）</text>
<text class="bl" x="120" y="592" style="fill:var(--mint-d);font-weight:900">●</text><text class="bl" x="136" y="592">体験をもとに、次のケアプランの提案に活かしていきます</text>
<line x1="64" x2="568" y1="614" y2="614" stroke="var(--mint)" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/>
<text class="hd" x="120" y="653">ケアプランの提案</text>
<rect x="118" y="681" width="305" height="11" rx="2" fill="var(--hl)" fill-opacity=".85"/><text class="hd" x="120" y="689" style="font-size:16px">ミッション：「この家で、ご利用者さんが</text>
<rect x="118" y="709" width="289" height="11" rx="2" fill="var(--hl)" fill-opacity=".85"/><text class="hd" x="120" y="717" style="font-size:16px">暮らせるプランを提案してください。」</text>
<text class="bl" x="120" y="750" style="fill:var(--mint-d);font-weight:900">●</text><text class="bl" x="136" y="750">チーム構成：参加者2名＋社会人メンター</text>
<text class="bl" x="136" y="772">（現場スタッフもしくは人事）</text>
<text class="bl" x="120" y="800" style="fill:var(--mint-d);font-weight:900">●</text><text class="bl" x="136" y="800">実際のご利用者さん像の共有後、</text>
<text class="bl" x="136" y="822">この家で暮らしていくためのプランを作成</text>
<text class="bl" x="120" y="850" style="fill:var(--mint-d);font-weight:900">●</text><text class="bl" x="136" y="850">実際の事例を踏まえて、人事・現場社員が</text>
<text class="bl" x="136" y="872">ガチFB（フィードバック）を実施</text>

<text class="hd" x="688" y="317">地方で働く先輩社員のトークセッション</text>
<text class="bl" x="688" y="346" style="fill:var(--mint-d);font-weight:900">●</text><text class="bl" x="704" y="346">活躍社員に聞く、地方企業ではたらくリアルをお届けします</text>
<line x1="632" x2="1136" y1="368" y2="368" stroke="var(--mint)" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/>
<text class="hd" x="688" y="407">マイライフプランを作成してみよう</text>
<text class="bl" x="688" y="436" style="fill:var(--mint-d);font-weight:900">●</text><text class="bl" x="704" y="436">春夏秋冬ワークを通して、</text>
<text class="bl" x="704" y="458">20代から100歳までのライフプランを作成してみましょう</text>
<text class="bl" x="688" y="486" style="fill:var(--mint-d);font-weight:900">●</text><text class="bl" x="704" y="486">ライフプランに対して、メンターからのフィードバック付き</text>
<line x1="632" x2="1136" y1="508" y2="508" stroke="var(--mint)" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/>
<text class="hd" x="688" y="547">解散</text>
<text class="bl" x="688" y="568" style="fill:var(--ink-s);font-size:14px;font-weight:700">17:30を予定しています</text>
