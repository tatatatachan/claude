<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日程のご予約</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1f2430;--sub:#6b7280;--accent:#2563eb;--line:#e5e7eb;--ng:#c0c4cc}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e26;--fg:#e8eaf0;--sub:#9aa1b0;--line:#2c313c;--ng:#4a4f5c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
h1{font-size:1.4rem;margin:0 0 4px}h2{font-size:1rem;margin:0 0 12px}
.sub{color:var(--sub);font-size:.9rem;white-space:pre-wrap}
label{display:block;font-size:.85rem;color:var(--sub);margin:12px 0 4px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px 20px;width:100%;margin-top:16px}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{width:auto;padding:8px 14px;margin:0}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1}
.day{margin-bottom:14px}.day b{display:block;margin-bottom:6px;font-size:.9rem}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{padding:8px 14px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px}
.slot.on{background:var(--accent);color:#fff}
.slot:disabled{border-color:var(--ng);color:var(--ng);text-decoration:line-through;cursor:default}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin:2px;font-size:.85rem}
.days{display:flex;gap:4px;flex-wrap:wrap}.days label{margin:0;display:flex;align-items:center;gap:2px;color:var(--fg)}.days input{width:auto}.win{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}.err{color:#dc2626;margin-top:12px}
.ok{text-align:center;padding:32px 0}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left}
a{color:var(--accent)}
</style>
</head>
<body>
<main id="app">読み込み中…</main>
<script>
// Apps Script をウェブアプリとしてデプロイした URL（…/exec）に置き換える
const API_URL = 'YOUR_APPS_SCRIPT_URL';

// 予約ページの種類ごとの追加入力項目
const TYPES = {
  student: { label: '学生との面談', fields: [['大学・学部', '例：○○大学 経済学部'], ['学年', '例：3年'], ['志望・関心のある企業', '']] },
  client: { label: 'クライアント・アライアンス先との打ち合わせ', fields: [['会社・団体名', ''], ['役職', '']] },
};

const $ = s => document.querySelector(s);
const app = $('#app');
const qs = new URLSearchParams(location.search);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['日','月','火','水','木','金','土'];
const fmtDay = d => { const t = new Date(d + 'T00:00:00'); return `${t.getMonth()+1}月${t.getDate()}日（${WD[t.getDay()]}）`; };
const post = body => fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) }).then(r => r.json());
const get = params => fetch(API_URL + '?' + new URLSearchParams(params)).then(r => r.json());
const base = location.origin + location.pathname;

function slotPicker(slots, onPick) {
  const days = {};
  slots.forEach(s => { const [d, t] = s.split(' '); (days[d] ||= []).push(t); });
  const html = Object.keys(days).map(d => `<div class="day"><b>${fmtDay(d)}</b><div class="slots">
    ${days[d].map(t => `<button class="slot" data-s="${d} ${t}">${t}</button>`).join('')}</div></div>`).join('')
    || '<p class="sub">現在、予約できる日時がありません。</p>';
  return { html, bind() {
    document.querySelectorAll('.slot').forEach(b => b.onclick = () => {
      document.querySelectorAll('.slot').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); onPick(b.dataset.s);
    });
  } };
}

/* ---------- 予約する側 ---------- */
async function guestView(id) {
  let p;
  try { p = await get({ action: 'page', id, ...(qs.get('key') && { key: qs.get('key') }) }); }
  catch { app.innerHTML = '<p class="err">読み込みに失敗しました。</p>'; return; }
  if (p.error) { app.innerHTML = `<p class="err">${esc(p.error)}</p>`; return; }
  const T = TYPES[p.type] || TYPES.student;
  let chosen = null;
  const pick = slotPicker(p.slots, s => { chosen = s; upd(); });

  app.innerHTML = `
    <div class="card"><h1>${esc(p.title)}</h1>
      <div class="sub">${esc(p.description)}</div>
      <div class="sub">所要時間：${p.duration}分 ／ オンライン</div></div>
    <div class="card"><h2>1. 日時を選ぶ</h2>${pick.html}</div>
    <div class="card"><h2>2. ご連絡先</h2>
      <label>お名前</label><input id="name" autocomplete="name">
      <label>メールアドレス</label><input id="email" type="email" autocomplete="email">
      ${T.fields.map((f, i) => `<label>${f[0]}</label><input class="x" data-k="${f[0]}" placeholder="${f[1]}">`).join('')}
      <label>ご要望・事前に伝えたいこと（任意）</label><textarea id="note" rows="3"></textarea>
      <button class="btn" id="go" disabled>予約を確定する</button><div class="err" id="err"></div></div>
    ${p.bookings ? `<div class="card"><h2>予約一覧（管理用）</h2><table>
      <tr><th>日時</th><th>お名前</th><th>メール</th><th>詳細</th></tr>
      ${p.bookings.map(b => `<tr><td>${esc(b.slot)}</td><td>${esc(b.name)}</td><td>${esc(b.email)}</td><td>${esc(Object.entries(JSON.parse(b.extra||'{}')).map(([k,v])=>k+':'+v).join(' / '))} ${esc(b.note)}</td></tr>`).join('') || '<tr><td colspan=4>まだありません</td></tr>'}
    </table></div>` : ''}`;
  pick.bind();
  const upd = () => { $('#go').disabled = !(chosen && $('#name').value.trim() && $('#email').value.trim()); };
  ['name', 'email'].forEach(i => $('#' + i).oninput = upd);
  $('#go').onclick = async () => {
    $('#go').disabled = true; $('#err').textContent = '';
    const extra = {}; document.querySelectorAll('.x').forEach(i => { if (i.value.trim()) extra[i.dataset.k] = i.value.trim(); });
    let r;
    try { r = await post({ action: 'book', id, slot: chosen, name: $('#name').value.trim(), email: $('#email').value.trim(), note: $('#note').value.trim(), extra }); }
    catch { r = { error: '通信に失敗しました' }; }
    if (!r.ok) { $('#err').textContent = r.error || '失敗しました'; $('#go').disabled = false; return; }
    const [d, t] = chosen.split(' ');
    app.innerHTML = `<div class="card ok"><h1>予約が完了しました</h1>
      <p>${fmtDay(d)} ${t}〜（${p.duration}分）<br>カレンダー招待をメールでお送りしました。</p>
      ${r.meetUrl ? `<p><a href="${esc(r.meetUrl)}">オンライン会議URL</a></p>` : ''}
      <p class="sub">変更・キャンセルは<a href="${base}?manage=${r.token}">こちら</a>（このリンクを保存してください）</p></div>`;
  };
}

/* ---------- 変更・キャンセル ---------- */
async function manageView(token) {
  const m = await get({ action: 'manage', token });
  if (m.error) { app.innerHTML = `<p class="err">${esc(m.error)}</p>`; return; }
  if (m.status !== 'confirmed') { app.innerHTML = '<div class="card ok"><h1>この予約はキャンセル済みです</h1></div>'; return; }
  let chosen = null;
  const pick = slotPicker(m.slots, s => { chosen = s; $('#re').disabled = false; });
  const [d, t] = m.slot.split(' ');
  app.innerHTML = `
    <div class="card"><h1>${esc(m.title)}</h1><p>${esc(m.name)}様<br>現在のご予約：${fmtDay(d)} ${t}〜（${m.duration}分）</p>
      <button class="btn" id="cx" style="background:#dc2626">この予約をキャンセルする</button></div>
    <div class="card"><h2>日時を変更する</h2>${pick.html}
      <button class="btn" id="re" disabled>この日時に変更する</button></div>
    <div class="err" id="err"></div>`;
  pick.bind();
  const done = msg => app.innerHTML = `<div class="card ok"><h1>${msg}</h1></div>`;
  $('#cx').onclick = async () => { if (!confirm('キャンセルしますか？')) return; const r = await post({ action: 'cancel', token }); r.ok ? done('キャンセルしました') : $('#err').textContent = r.error; };
  $('#re').onclick = async () => { const r = await post({ action: 'reschedule', token, slot: chosen }); r.ok ? done('日程を変更しました。更新された招待をご確認ください。') : $('#err').textContent = r.error; };
}

/* ---------- 予約ページを作る側（齋藤さん用） ---------- */
function adminView() {
  const winHtml = (days = [1,2,3,4,5], st = '10:00', en = '18:00') => `<div class="win">
    <div class="days">${WD.map((w, i) => `<label><input type="checkbox" value="${i}" ${days.includes(i) ? 'checked' : ''}>${w}</label>`).join('')}</div>
    <div class="row"><div><label>開始</label><input type="time" class="st" value="${st}"></div>
      <div><label>終了</label><input type="time" class="en" value="${en}"></div></div></div>`;
  app.innerHTML = `
    <div class="card"><h1>予約ページを作る</h1>
      <label>合言葉</label><input id="pass" type="password">
      <label>種類</label><select id="type">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('')}</select>
      <label>タイトル</label><input id="title" placeholder="例：オンライン面談">
      <label>説明（任意）</label><textarea id="desc" rows="2"></textarea>
      <label>所要時間（分）</label><select id="dur"><option>15</option><option>30</option><option selected>60</option><option>90</option><option>120</option></select></div>
    <div class="card"><h2>入れていい時間</h2>
      <div class="sub">この曜日・時間帯の中から、Googleカレンダーに予定が入っていない枠だけが相手に表示されます。</div>
      <div id="wins" style="margin-top:8px">${winHtml()}</div>
      <button class="btn sm" id="addw" type="button">＋ 時間帯を追加</button>
      <div class="row"><div><label>何日先まで公開</label><select id="hor"><option>7</option><option selected>14</option><option>21</option><option>30</option><option>60</option></select></div>
        <div><label>直前の予約を締め切る（時間前）</label><select id="lead"><option>0</option><option>3</option><option>12</option><option selected>24</option><option>48</option></select></div></div>
      <label>会議URL（任意：Zoomなど。空ならGoogle Meetを自動発行）</label><input id="murl" placeholder="https://zoom.us/j/…">
      <button class="btn" id="make">リンクを発行</button><div class="err" id="err"></div></div>
    <div id="result"></div>`;
  $('#addw').onclick = () => $('#wins').insertAdjacentHTML('beforeend', winHtml([], '10:00', '18:00'));
  $('#make').onclick = async () => {
    const windows = [...document.querySelectorAll('.win')].map(w => ({
      days: [...w.querySelectorAll('input[type=checkbox]:checked')].map(c => +c.value),
      start: w.querySelector('.st').value, end: w.querySelector('.en').value,
    })).filter(w => w.days.length && w.start < w.end);
    if (!$('#title').value.trim() || !windows.length) { $('#err').textContent = 'タイトルと入れていい時間帯を設定してください'; return; }
    $('#make').disabled = true; $('#err').textContent = '';
    const r = await post({ action: 'create', passcode: $('#pass').value, type: $('#type').value, title: $('#title').value.trim(),
      description: $('#desc').value.trim(), duration: +$('#dur').value, windows, horizon: +$('#hor').value, lead: +$('#lead').value, meetingUrl: $('#murl').value.trim() });
    $('#make').disabled = false;
    if (r.error) { $('#err').textContent = r.error; return; }
    $('#result').innerHTML = `<div class="card"><h2>発行しました</h2>
      <label>相手に送るリンク</label><input readonly value="${base}?id=${r.id}" onclick="this.select()">
      <label>管理用リンク（予約一覧が見えます。齋藤さんだけが保管）</label><input readonly value="${base}?id=${r.id}&key=${r.adminKey}" onclick="this.select()"></div>`;
  };
}

if (API_URL === 'YOUR_APPS_SCRIPT_URL') app.innerHTML = '<p class="err">index.html の API_URL を設定してください。</p>';
else if (qs.get('manage')) manageView(qs.get('manage'));
else if (qs.get('id')) guestView(qs.get('id'));
else adminView();
</script>
</body>
</html>
